version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gestor_pdf_db
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Buenos_Aires
      POSTGRES_DB: ${DB_NAME:-gestor_pdf}
      POSTGRES_USER: ${DB_USER:-gestor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestor_pass_123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gestor_pdf_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestor_user} -d ${DB_NAME:-gestor_pdf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestor_pdf_app
    user: "1000:1000"       
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Argentina/Buenos_Aires
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-supersecretkeychangeinproduction}
      DATABASE_URL: postgresql://${DB_USER:-gestor_user}:${DB_PASSWORD:-gestor_pass_123}@db:5432/${DB_NAME:-gestor_pdf}
      UPLOAD_FOLDER: /app/uploads
      MAX_CONTENT_LENGTH: 5242880
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gestorpdf.com}
    ports:
      - "${APP_PORT:-5050}:5000"
    volumes:
#      - ./uploads:/app/uploads
      - /mnt/dms_nas:/app/uploads
    networks:
      - gestor_pdf_network

  nginx:
    image: nginx:1.25-alpine
    container_name: gestor_pdf_nginx
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - gestor_pdf_network

volumes:
  postgres_data:
    driver: local

networks:
  gestor_pdf_network:
    driver: bridge
